xt">NEXT ACTION</div><div style="margin-top:8px">${a.next}</div></div></div><div class="divider"></div><div class="title-actions"><button class="btn primary" onclick="createOpp('${a.id}')">Create Opportunity</button><button class="btn" onclick="go('Decision-Maker Intelligence');modal=null;render()">Find Decision Makers</button><button class="btn" onclick="go('Partners & Distributors');modal=null;render()">Find Partners</button><button class="btn" onclick="act('Intelligence generated')">Generate Intelligence</button><button class="btn" onclick="act('Added to watchlist')">Add to Watchlist</button></div>`,foot:`<button class="btn" onclick="modal=null;renderModal()">Close profile</button>`};renderModal()}
function createOpp(id){let a=accounts.find(x=>x.id===id);opps.unshift({id:'o'+Date.now(),account:a.name,name:a.name+' Market Access',value:a.value,stage:'QUALIFIED',owner:'You',prob:20,next:'Qualify commercial fit',date:'Just now'});modal=null;go('Opportunity Pipeline');toast('Opportunity created in Qualified stage')}

function reportPreview(name){modal={title:name,wide:true,body:`<div class="reportpage"><div class="eyebrow">ENEXUR GLOBAL MARKET ACCESS OS™ · DEMO</div><h2>${esc(name)}</h2><div style="font:11px Georgia;color:#687982">India Market Access Program · October 02, 2026</div><hr><h3>Executive Summary</h3><p>This intelligence brief consolidates the current demo workspace view into a practical market-access decision aid. India presents a meaningful opportunity for focused international expansion, provided segment fit, route to market and execution readiness are validated.</p><h3>Key Findings</h3><ul><li>Priority account signals cluster around industrial automation, process equipment and components.</li><li>Partner-led discovery can reduce initial channel uncertainty.</li><li>Executive sponsorship and clear target segment definition are critical readiness factors.</li></ul><h3>Evidence & Confidence</h3><p>Illustrative demo records, assessment inputs and modeled signal confidence. This report contains no verified live CRM data or third-party research.</p><h3>Opportunity & Risks</h3><p>Opportunity: ${money(accounts.reduce((s,a)=>s+a.value,0))} in illustrative target-account value. Risks include unvalidated demand, regulatory requirements, channel economics and local service capability.</p><h3>Recommended Actions</h3><ol><li>Validate priority segments and buying criteria with decision makers.</li><li>Shortlist partners against capability, coverage and compliance criteria.</li><li>Agree a staged market-entry hypothesis and measurable success metrics.</li></ol><h3>Next Steps</h3><p>Assign account owners, schedule discovery conversations and review the 30/60/90 day execution roadmap.</p><hr><div style="font:9px Georgia;color:#839197">Prepared in the ENEXUR demo workspace · AI generated draft · Human approval required before external use</div></div>`,foot:`<button class="btn" onclick="modal=null;renderModal()">Close</button><button class="btn" onclick="act('Share link prepared in prototype')">Share</button><button class="btn primary" onclick="downloadReport('${esc(name)}')">Download demo report</button>`};renderModal()}
function downloadReport(name){const text=`${name}\nENEXUR Global Market Access OS™\nDEMO DATA — NOT LIVE CRM DATA\n\nExecutive Summary\nIndia presents a meaningful opportunity for focused international expansion, provided segment fit, route to market and execution readiness are validated.\n\nKey Findings\n• Priority account signals cluster around industrial automation, process equipment and components.\n• Partner-led discovery can reduce initial channel uncertainty.\n• Human approval is required for external and commercial commitments.\n\nRecommended Actions\n1. Validate priority segments and buying criteria.\n2. Shortlist partners against capabilities and compliance criteria.\n3. Agree measurable market-entry success metrics.\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-demo-report.txt';a.click();URL.revokeObjectURL(a.href);toast('Demo report downloaded')}

function adminPage(){let m=page;let titles={'All Clients':'All Clients','Revenue':'Revenue OS','Delivery':'Delivery Operations','Prospecting':'Prospecting Operations','Partner Network':'Partner Network','AI Operations':'AI Operations'};return `${header(titles[m]||m,'Enexur Admin Console · Cross-client delivery and operating health. All values are illustrative demo data.',`<span class="tag demo">ENEXUR ADMIN PREVIEW</span><button class="btn" onclick="act('Admin export prepared')">Export</button>`)}<div class="grid kpis">${kpi('Active clients','24','Demo portfolio')}${kpi('MRR','$186K','Illustrative planning data')}${kpi('Open pipeline','$1.42M','Not a forecast')}${kpi('Confirmed revenue','$410K','Illustrative only')}${kpi('Open delivery tasks','37','Across active programs')}${kpi('Accounts researched','1,248','Demo operations')}${kpi('Decision makers enriched','3,620','Demo operations')}${kpi('Partners identified','214','Demo operations')}</div><div class="grid two"><div class="card">${cardHead('Client Program Health')}<div class="tablewrap"><table><thead><tr><th>Client</th><th>Market</th><th>Health</th><th>Delivery</th><th>Next milestone</th></tr></thead><tbody>${[['Northstar Systems','India','On track','72%','Partner shortlist'],['Gulf Process Technologies','India','Attention','54%','Proposal review'],['EuroTech Components','India','On track','68%','Segment validation'],['Pacific Automation','India','On track','41%','Discovery']].map(r=>`<tr>${r.map((x,i)=>`<td>${i===0?`<strong>${x}</strong>`:x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div><div class="card">${cardHead('Revenue Architecture','<span class="tag">PLANNING OBJECTIVE</span>')}<div class="eyebrow">STRATEGIC REVENUE ARCHITECTURE / PLANNING OBJECTIVE</div><div class="kpi-value">$100M</div><p class="smalltext">Long-range strategic planning objective. This is not a forecast.</p><div class="funnel">${[['Enterprise contracts',75,82],['Growth contracts',57,68],['Entry-level services',38,51],['Recurring Market Access OS',62,71]].map(x=>`<div class="funnelrow"><span class="funnel-label" style="width:130px">${x[0]}</span><div class="funnel-track"><div class="funnel-fill" style="width:${x[2]}%"></div></div></div>`).join('')}</div></div></div><div class="grid three section">${['Delivery capacity','Prospecting throughput','Partner conversion'].map((x,i)=>`<div class="card"><div class="eyebrow">${x.toUpperCase()}</div><div class="kpi-value">${[86,73,34][i]}%</div><div class="progress"><i style="width:${[86,73,34][i]}%"></i></div><p class="smalltext">Illustrative operations indicator</p><button class="btn small" onclick="act('${x} workspace opened')">Open operations</button></div>`).join('')}</div>`}
function renderPage(){if(page==='Executive Command Center')return dashboard();if(page==='Target Accounts')return accountsPage();if(page==='Decision-Maker Intelligence')return contactsPage();if(page==='Partners & Distributors')return partnersPage();if(page==='Opportunity Radar')return radarPage();if(page==='Opportunity Pipeline')return pipelinePage();if(page==='India Opportunity Score')return scorePage();if(page==='Market Intelligence')return marketPage();if(page==='Competitor Intelligence')return competitorsPage();if(page==='Outreach & Engagement')return outreachPage();if(page==='Meeting Intelligence')return meetingsPage();if(page==='Reports & Intelligence Vault')return reportsPage();if(page==='AI Intelligence Studio')return aiPage();if(page==='Workspace & Integrations')return settingsPage();if(page==='Billing')return billingPage();if(page==='Team & Permissions')return teamPage();return adminPage()}
function render(){let current=page;$('.modalback')?.remove();$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">E</div><div><b>ENEXUR GLOBAL</b><small>MARKET ACCESS OS™</small></div></div><div class="workspace" onclick="workspace=workspace==='Demo Enterprise'?'Northstar Systems Demo':'Demo Enterprise';toast('Workspace switched to '+workspace)"><small>WORKSPACE ▾</small><strong>${workspace}</strong><small style="display:block;margin-top:4px;color:#60798b">India Market Access Program</small></div>${nav.map(([g,items])=>`<div class="navgroup"><div class="navlabel">${g}</div>${items.map(([n,i])=>`<div class="navitem ${current===n?'active':''} ${g==='ENEXUR ADMIN'?'admin-nav':''}" onclick="go('${n}')"><span class="ico">${i}</span>${n}</div>`).join('')}</div>`).join('')}<div class="demo-label">● DEMO WORKSPACE · NOT LIVE CRM DATA</div></aside><main class="main"><header class="topbar"><button class="hamb" onclick="$('.sidebar').classList.toggle('open')">☰</button><div class="searchbox"><input placeholder="Search accounts, decision makers, partners, opportunities..." value="${esc(search)}" onkeydown="if(event.key==='Enter')globalSearch(this.value)" oninput="search=this.value"></div><div class="top-actions"><span class="status">AI Agent Ready</span><button class="iconbtn" onclick="notifications()">♧</button><button class="iconbtn" onclick="quickMenu()">＋</button><button class="avatar" onclick="profileMenu()">AP</button></div></header><div class="content">${renderPage()}</div></main><nav class="mobile-nav"><button onclick="go('Executive Command Center')" class="${page==='Executive Command Center'?'active':''}">⌂<br>Home</button><button onclick="go('Target Accounts')">▦<br>Accounts</button><button onclick="go('Opportunity Pipeline')">▤<br>Pipeline</button><button onclick="go('AI Intelligence Studio')">✧<br>AI Studio</button><button onclick="$('.sidebar').classList.toggle('open')">☰<br>Menu</button></nav></div>`;if(modal)renderModal()}
function globalSearch(q){search=q;if(!q.trim())return go('Executive Command Center');let found=accounts.find(a=>a.name.toLowerCase().includes(q.toLowerCase()));if(found){go('Target Accounts');setTimeout(()=>accountProfile(found.id),20);return}let c=contacts.find(x=>x.name.toLowerCase().includes(q.toLowerCase()));if(c){go('Decision-Maker Intelligence');setTimeout(()=>contactProfile(contacts.indexOf(c)),20);return}let p=partners.find(x=>x.name.toLowerCase().includes(q.toLowerCase()));if(p){go('Partners & Distributors');setTimeout(()=>partnerProfile(p.name),20);return}let o=opps.find(x=>x.name.toLowerCase().includes(q.toLowerCase()));if(o){go('Opportunity Pipeline');setTimeout(()=>oppProfile(o.id),20);return}let r=reports.find(x=>x.toLowerCase().includes(q.toLowerCase()));if(r){go('Reports & Intelligence Vault');setTimeout(()=>reportPreview(r),20);return}toast('No matching demo records found')}
function quickMenu(){openModal('Quick create',`<div class="grid three"><button class="card" onclick="modal=null;addAccount()">＋<br><b>Account</b></button><button class="card" onclick="modal=null;createOppModal()">＋<br><b>Opportunity</b></button><button class="card" onclick="modal=null;openModal('Create outreach',formFields(['Account','Contact','Message']))">＋<br><b>Outreach</b></button><button class="card" onclick="modal=null;openModal('Schedule meeting',formFields(['Meeting title','Account','Date']))">＋<br><b>Meeting</b></button><button class="card" onclick="modal=null;reportPreview('CEO Executive Brief')">＋<br><b>Report</b></button><button class="card" onclick="modal=null;go('India Opportunity Score')">◉<br><b>Assessment</b></button></div>`)}function notifications(){openModal('Notifications',`<div class="list"><div class="listrow"><i class="bullet"></i><div><strong>New high-intent signal</strong><p>Nordic Industrial Systems · 12 min ago</p></div></div><div class="listrow"><i class="bullet"></i><div><strong>Proposal follow-up due</strong><p>Gulf Process Technologies · Today</p></div></div><div class="listrow"><i class="bullet"></i><div><strong>Onboarding progress saved</strong><p>India Market Access Program · Yesterday</p></div></div></div>`)}function profileMenu(){openModal('Aarav Patel',`<div class="eyebrow">CLIENT ADMIN · DEMO WORKSPACE</div><p class="smalltext">User profile · preferences · session controls</p><div class="list"><div class="listrow"><strong>Role</strong><span style="margin-left:auto">${role}</span></div><div class="listrow"><strong>Workspace</strong><span style="margin-left:auto">${workspace}</span></div></div><button class="btn" onclick="act('Profile settings opened')">Profile settings</button> <button class="btn" onclick="act('Signed out of prototype session')">Sign out</button>`)}
render();
</script></body></html>
